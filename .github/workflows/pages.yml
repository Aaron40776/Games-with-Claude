# Builds the games and publishes them on GitHub Pages.
# Riftdeck: https://<user>.github.io/Games-with-Claude/riftdeck/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riftdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: riftdeck/package-lock.json
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p ../site/riftdeck
          cp dist/index.html ../site/riftdeck/index.html
          cp ../pages/index.html ../site/index.html
          touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
